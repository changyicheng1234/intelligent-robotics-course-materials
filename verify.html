<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Star 验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.8em;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }

        .info-box h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .info-box ol {
            margin-left: 20px;
            color: #555;
        }

        .info-box li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .info-box a {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            font-family: monospace;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            line-height: 1.6;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 20px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 0.85em;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 GitHub Star 验证</h1>
        
        <div class="info-box">
            <h3>📝 如何获取 GitHub Token：</h3>
            <ol>
                <li>访问 <a href="https://github.com/settings/tokens/new" target="_blank">GitHub Token 创建页面</a></li>
                <li>填写名称（如：<code>star-verify</code>）</li>
                <li>过期时间可选 7 天或 30 天</li>
                <li>勾选权限：<strong>public_repo</strong>（在 repo 下）</li>
                <li>点击 "Generate token" 并复制</li>
            </ol>
        </div>

        <form id="verify-form">
            <div class="form-group">
                <label for="token">GitHub Personal Access Token：</label>
                <input type="text" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required autocomplete="off">
            </div>
            <button type="submit" class="btn" id="submit-btn">✅ 验证 Star 状态</button>
        </form>

        <div id="message"></div>

        <div class="security-note">
            🔒 你的 Token 仅在浏览器本地存储和使用，不会发送到任何第三方服务器。<br>
            所有请求直接从你的浏览器发送到 GitHub 官方 API。
        </div>

        <a href="index.html" class="back-link">← 返回主页</a>
    </div>

    <script>
        const REPO_OWNER = 'changyicheng1234';
        const REPO_NAME = 'intelligent-robotics-course-materials';
        const REPO_FULL_NAME = `${REPO_OWNER}/${REPO_NAME}`;

        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value.trim();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submit-btn');
            
            if (!token) {
                messageDiv.innerHTML = '<div class="message error">请输入 GitHub Token</div>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 正在验证...';
            messageDiv.innerHTML = '<div class="message info">正在连接 GitHub API 验证...</div>';

            try {
                // 第一步：验证 Token 是否有效
                const userResponse = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!userResponse.ok) {
                    throw new Error('Token 无效或已过期，请检查后重试');
                }

                const userData = await userResponse.json();
                const username = userData.login;

                // 第二步：检查用户是否 Star 了仓库
                const starResponse = await fetch(`https://api.github.com/user/starred/${REPO_FULL_NAME}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (starResponse.status === 204) {
                    // 已 Star - 保存验证信息
                    const verifyData = {
                        token: token,
                        username: username,
                        time: Date.now()
                    };
                    // 简单编码存储，不是加密，但避免明文
                    sessionStorage.setItem('gh_verify', btoa(JSON.stringify(verifyData)));
                    localStorage.setItem('star_verified_time', Date.now().toString());

                    messageDiv.innerHTML = `<div class="message success">✅ 验证成功！欢迎 <strong>@${username}</strong>，正在跳转到例题页面...</div>`;
                    
                    setTimeout(() => {
                        window.location.href = 'protected-images.html';
                    }, 1500);

                } else if (starResponse.status === 404) {
                    // 未 Star
                    messageDiv.innerHTML = `<div class="message error">❌ 用户 <strong>@${username}</strong> 尚未 Star 该仓库。<br><br>请先前往 <a href="https://github.com/${REPO_FULL_NAME}" target="_blank">GitHub 仓库</a> 点击 ⭐ Star，然后重新验证。</div>`;
                } else {
                    throw new Error('验证请求失败，请稍后重试');
                }

            } catch (error) {
                console.error('验证错误:', error);
                messageDiv.innerHTML = `<div class="message error">❌ ${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ 验证 Star 状态';
            }
        });

        // 如果已有有效验证，提供快速入口
        window.addEventListener('DOMContentLoaded', () => {
            const verifyData = sessionStorage.getItem('gh_verify');
            if (verifyData) {
                try {
                    const data = JSON.parse(atob(verifyData));
                    const elapsed = Date.now() - data.time;
                    if (elapsed < 24 * 60 * 60 * 1000 && data.token) {
                        const messageDiv = document.getElementById('message');
                        messageDiv.innerHTML = `<div class="message success">✅ 你已经验证过了（@${data.username}）。<a href="protected-images.html">直接查看例题 →</a></div>`;
                    }
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
